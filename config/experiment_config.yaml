# ============================================================
# Experiment Configuration — MAS Leadership Experiment
# ============================================================
# This file is the single source of truth for all experiment parameters.
# The experiment runner reads this file and passes values to all modules.
# ============================================================

# --- MODELS ---
# CHECK PRICING: https://docs.anthropic.com/en/docs/about-claude/models

models:
  boss: "claude-sonnet-5"                # smart model for nuanced leadership behavior
  worker: "claude-haiku-4-5-20251001"    # cheap model, workers make the most API calls

# --- SAMPLING ---
max_tokens_per_response: 1024       # Max tokens for Writer, Reviewer
boss_max_tokens_per_response: 8192  # Boss needs headroom: adaptive thinking shares max_tokens budget
coder_max_tokens_per_response: 8192 # Coder needs more tokens for multi-chart code scripts
boss_effort: "medium"               # Reduce thinking depth for Boss (prevents thinking-only responses)

# --- EXPERIMENT DESIGN ---
repetitions: 5         # How many times each condition is repeated (3-5 recommended)
max_revision_rounds: 2    # Max revision rounds in Phase 6 before forcing delivery
max_coding_extensions: 2  # Max times Boss can send Coder back in Phase 3 (gives 3 retries each)

# --- LEADERSHIP STYLES ---
# 7 conditions: 6 Goleman styles + 1 baseline
styles:
  - coercive
  - authoritative
  - affiliative
  - democratic
  - pacesetting
  - coaching
  - baseline

# --- TASKS ---
# Only "short" and "long" are used in experiments.
# "test" is for smoke testing the pipeline (not included in batch runs).
experiment_tasks:
  - short    # "Quick Insights Report"
  - long     # "Full EDA"

# --- TOKEN BUDGETS (safety nets, TBD after smoke testing) ---
# These prevent runaway API costs. Set exact values after running smoke tests.
token_budgets:
  per_agent_per_run: null    # total tokens one agent can use in a run
  per_phase: null            # total tokens allowed in a single phase
  per_run: null              # hard ceiling for entire experiment run

# --- DATASET ---
dataset_path: "data/global_weather.csv"
